on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The logic below handles the npm publication:
      - name: Checkout Git repository
        # these if statements ensure that a publication only occurs when
        # a new release is created:
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
        if: ${{ steps.release.outputs.release_created }}
      - name: Pack
        run: vp pack
        if: ${{ steps.release.outputs.release_created }}
      - name: Publish
        run: pnpm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
      - name: Install Pkl CLI
        if: ${{ steps.release.outputs.release_created }}
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0
        with:
          pkl-version: 0.31.1
      - name: Build Pkl package
        if: ${{ steps.release.outputs.release_created }}
        run: pkl project package --skip-publish-check
      - name: Upload Pkl package artifacts to release
        if: ${{ steps.release.outputs.release_created }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" .out/*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

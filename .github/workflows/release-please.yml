on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The logic below handles the npm publication:
      - name: Checkout Git repository
        # these if statements ensure that a publication only occurs when
        # a new release is created:
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.15.0
        with:
          cache: true
        if: ${{ steps.release.outputs.release_created }}
      - name: Pack
        run: vp pack
        if: ${{ steps.release.outputs.release_created }}
      - name: Publish
        run: pnpm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
      - name: Install Pkl CLI
        if: ${{ steps.release.outputs.release_created }}
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - name: Build Pkl package
        if: ${{ steps.release.outputs.release_created }}
        run: pkl project package --skip-publish-check
      - name: Upload Pkl package artifacts to release
        if: ${{ steps.release.outputs.release_created }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" .out/*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

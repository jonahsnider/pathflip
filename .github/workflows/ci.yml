name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      - name: Check
        run: vp check
      - name: Run tests
        run: vp test
      - name: Check for unused code and dependencies
        run: vp exec knip
      - name: Pack
        run: vp pack
